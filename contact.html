<main>

    <div class="crumbs"><a href="index.html">home</a> / contact</div>
    <h1 class="reveal">Say <span class="grad">hello</span></h1>
    <p class="lead reveal d1" style="margin-top:18px">I'm open to data analyst and data science opportunities. The quickest way to reach me is email.</p>
  </div>

    </form>
  </section>
